<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<!-- Devtec agents bot screen. The bot logic (catalog, access code, search) lives in n8n workflow "דבטק – בוט קבצים לסוכנים" -->
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" type="image/png" href="icon-192-v2.png">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="דבטק">
<meta name="application-name" content="דבטק">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>דבטק-אפליקציה</title>
<meta name="description" content="מפרטים, תמונות, סרטונים וטפסים לסוכני דבטק">
<meta property="og:type" content="website">
<meta property="og:title" content="דבטק-אפליקציה">
<meta property="og:description" content="מפרטים, תמונות, סרטונים וטפסים לסוכני דבטק">
<meta property="og:url" content="https://yanivdevtec-ai.github.io/devtec-agents-bot/">
<meta property="og:image" content="https://yanivdevtec-ai.github.io/devtec-agents-bot/icon-512-v2.png">
<meta property="og:locale" content="he_IL">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0d0d;color:#f2f2f2;font-family:Heebo,Assistant,Arial,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}
header{background:#000;border-bottom:3px solid #40af49;padding:10px 12px;text-align:center}
.logo{display:block;margin:0 auto 6px;width:190px;height:38px;border-radius:8px;background:#fff url("https://devtec.co.il/wp-content/uploads/2016/06/logo-%D7%94%D7%98%D7%95%D7%91.png") center/178px auto no-repeat}
header h1{margin:0;font-size:23px;color:#fff}
header p{margin:2px 0 0;font-size:15px;color:#9be3a0}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 12px;border-radius:14px;line-height:1.55;font-size:18px;word-wrap:break-word;overflow-wrap:anywhere}
.bot{align-self:flex-start;background:#1f1f1f;border:1px solid #2c2c2c}
.me{align-self:flex-end;background:#40af49;color:#fff}
.m a{color:#5ed266;font-weight:600}
.m strong{color:#fff}
.m img{max-width:100px;border-radius:6px;vertical-align:middle;margin-left:6px}
.inl{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
#bar{display:none;padding:8px 8px 0;background:#000;border-top:1px solid #222}
.row{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid #40af49;background:#161616;color:#fff;border-radius:18px;padding:10px 14px;font-size:16px;font-family:inherit;cursor:pointer;white-space:nowrap}
.chip.on{background:#40af49}
.chip.yes{background:#40af49}
footer{display:flex;gap:8px;padding:8px;background:#000}
#in{flex:1;background:#161616;color:#fff;border:1px solid #40af49;border-radius:20px;padding:12px 16px;font-size:18px;font-family:inherit;outline:none}
#in::placeholder{color:#8a8a8a}
#send{background:#40af49;color:#fff;border:none;border-radius:20px;padding:0 18px;font-size:18px;font-family:inherit;cursor:pointer}
.typing{opacity:.7;font-style:italic}
.lock{display:block;margin-top:12px;padding:12px;border:2px solid #40af49;border-radius:12px;background:#0f2a12;color:#fff;font-weight:800;font-size:21px;text-align:center}
#in.need{border-width:3px;box-shadow:0 0 0 3px rgba(64,175,73,.35)}
header{padding-top:calc(10px + env(safe-area-inset-top))}
footer{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
header{position:relative}
#switch{display:none;position:absolute;left:8px;bottom:6px;background:#161616;color:#9be3a0;border:1px solid #40af49;border-radius:14px;padding:5px 10px;font-size:13px;font-family:inherit;cursor:pointer}
.scr{display:none;flex:1;overflow-y:auto;padding:18px 14px}
.scr h2{margin:4px 0 14px;font-size:21px;text-align:center;color:#fff}
.big{display:block;width:100%;margin:0 0 12px;padding:18px 14px;border:2px solid #40af49;border-radius:14px;background:#161616;color:#fff;font-size:20px;font-weight:700;font-family:inherit;text-align:right;cursor:pointer;text-decoration:none}
.big small{display:block;margin-top:4px;font-size:14px;font-weight:400;color:#9be3a0}
.big.go{background:#40af49}
.big.go small{color:#eaffea}
#codeIn{display:block;width:100%;margin:6px 0 12px;background:#161616;color:#fff;border:3px solid #40af49;border-radius:14px;padding:14px;font-size:24px;text-align:center;letter-spacing:6px;font-family:inherit;outline:none}
.note{color:#bdbdbd;font-size:15px;text-align:center;margin:8px 0}
.err{color:#ff8a80;font-weight:700;text-align:center;min-height:22px}
.drafts{margin:0 0 16px;padding:14px;border:3px solid #e53935;border-radius:14px;background:#1a0d0d}
.drafts h3{margin:0 0 10px;font-size:19px;color:#fff}
.draft{padding:10px 0;border-top:1px solid #3a2222}
.draft b{display:block;font-size:18px;color:#fff}
.draft span{display:block;font-size:14px;color:#bdbdbd;margin:2px 0 8px}
.draft a{display:block;padding:12px;border-radius:12px;background:#40af49;color:#fff;font-size:17px;font-weight:700;text-align:center;text-decoration:none}
</style>
</head>
<body>
<div id="app">
<header><button id="switch">⇄ כניסה אחרת</button><span class="logo"></span><h1 id="ttl">דבטק – קבצים לסוכנים</h1><p id="sub">מפרטים, גיליונות בטיחות, קטלוגים וסרטונים</p></header>
<div class="scr" id="cats">
<h2>מי נכנס?</h2>
<button class="big" data-c="agents">🧑‍💼 סוכנים<small>מפרטים, תמונות, סרטונים וטפסים</small></button>
<button class="big" data-c="warehouse">📦 מחסן ולוגיסטיקה<small>טופס החזרת סחורה</small></button>
<button class="big" data-c="collect">💰 גבייה והנהלת חשבונות<small>דיווחי גבייה</small></button>
<button class="big" data-c="manage">⭐ ניהול<small>כל האפשרויות</small></button>
</div>
<div class="scr" id="login">
<h2 id="loginTtl">כניסה</h2>
<p class="note">🔒 הקלידו את קוד הכניסה שלכם</p>
<input id="codeIn" type="tel" inputmode="numeric" autocomplete="off" maxlength="8">
<div class="err" id="loginErr"></div>
<button class="big go" id="loginGo" style="text-align:center">כניסה</button>
<button class="big" id="loginBack" style="text-align:center">חזרה</button>
</div>
<div class="scr" id="panel"></div>
<div id="msgs"></div>
<div id="bar">
<div class="row" id="types">
<button class="chip" data-v="1">📄 מפרט טכני</button>
<button class="chip" data-v="b">📚 ברושורים וקטלוגים</button>
<button class="chip" data-v="v">🎬 סרטונים</button>
<button class="chip" data-v="p">🖼️ תמונות</button>
<button class="chip" data-v="4">⚠️ גיליון בטיחות</button>
<button class="chip" data-v="0">🏠 כל הסוגים</button>
</div>
<div class="row" id="forms">
<button class="chip" data-v="#f1">📝 טופס פתיחת לקוח</button>
<button class="chip" data-v="#f2">🏦 אישור ניהול חשבון</button>
<button class="chip" data-v="#f3">📒 אישור ניהול ספרים</button>
</div>
</div>
<footer><input id="in" placeholder="מה לשלוח לך?" autocomplete="off"><button id="send">שלח</button></footer>
</div>
<script>
(function(){
var API = 'https://yanivsofir.app.n8n.cloud/webhook/devtec-agents-msg';
var DAYS = 5;
var mem = {};
function get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }
function set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } }
function getCookie(n){ try { var m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; } catch(e){ return null; } }
function setCookie(n,v,days){ try { document.cookie = n + '=' + encodeURIComponent(v) + '; max-age=' + Math.round(days*86400) + '; path=/; SameSite=Lax; Secure'; } catch(e){} }
function urlTok(){ try { return new URLSearchParams(location.search).get('t'); } catch(e){ return null; } }
function setUrlTok(t){ try { var u = new URL(location.href); if (t) u.searchParams.set('t', t); else u.searchParams.delete('t'); history.replaceState(null, '', u.toString()); } catch(e){} }
var tok = urlTok() || get('dv_tok') || getCookie('dv_tok') || '';
function saveTok(t){ tok = t; set('dv_tok', t); setCookie('dv_tok', t, DAYS); setUrlTok(t); }
function clearTok(){ tok = ''; set('dv_tok', ''); setCookie('dv_tok', '', 0); setUrlTok(''); }
if (tok) saveTok(tok);
var sid = get('dv_sid') || getCookie('dv_sid');
if (!sid) sid = 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
set('dv_sid', sid); setCookie('dv_sid', sid, DAYS);
var authed = !!tok || get('dv_ok') === '1';
var msgs = document.getElementById('msgs'), inp = document.getElementById('in'), bar = document.getElementById('bar');
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function md(s){
  var h = esc(s);
  h = h.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g, '<img src="$2" alt="$1">');
  h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return h.replace(/\n/g, '<br>');
}
function add(cls, html){ var d = document.createElement('div'); d.className = 'm ' + cls; d.innerHTML = html; msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d; }
function showBar(){ bar.style.display = authed ? 'block' : 'none'; inp.placeholder = authed ? 'מה לשלוח לך?' : '🔒 הקלידו כאן קוד גישה'; inp.classList.toggle('need', !authed); }
function mark(v){ var cs = document.querySelectorAll('#types .chip'); for (var i=0;i<cs.length;i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-v') === v && v !== '0'); }
function tidy(s){
  var k = s.indexOf('רוצים רק סוג אחד?');
  if (k >= 0) s = s.slice(0, k) + 'רוצים רק סוג אחד? לחצו על כפתור למטה 👇';
  s = s.replace('(לחזרה לתפריט שלחו 0)', '(לכל הסוגים: 🏠 בכפתורים למטה)');
  s = s.replace('לכל הסוגים או לתפריט שלחו 0', 'לכל הסוגים: 🏠 בכפתורים למטה');
  s = s.replace(' כתבו "כן"', '');
  return s;
}
var busy = false;
function send(text, label){
  text = String(text || '').trim(); if (!text || busy) return;
  busy = true; add('me', esc(label || text)); inp.value = '';
  var t = add('bot typing', 'מחפש…');
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: sid, chatInput: text, token: tok }) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (Array.isArray(j)) j = j[0] || {};
      var out = tidy(String(j.output || j.text || 'לא התקבלה תשובה, נסו שוב.'));
      if (j.token) saveTok(String(j.token));
      t.className = 'm bot'; t.innerHTML = (!authed && /קוד/.test(out) && !/קוד נכון/.test(out)) ? '<span class="lock">' + esc(out) + '</span>' : md(out);
      if (/קוד נכון/.test(out)) { authed = true; set('dv_ok','1'); showBar(); }
      if (/קוד גישה/.test(out) && !/קוד נכון/.test(out)) { authed = false; set('dv_ok','0'); clearTok(); showBar(); }
      if (/לשלוח גם\?/.test(out)) {
        var w = document.createElement('div'); w.className = 'inl';
        w.innerHTML = '<button class="chip yes">✅ כן, שלח</button><button class="chip">לא תודה</button>';
        w.children[0].onclick = function(){ w.remove(); send('כן', '✅ כן, שלח'); };
        w.children[1].onclick = function(){ w.remove(); send('לא תודה'); };
        t.appendChild(w);
      }
      msgs.scrollTop = msgs.scrollHeight;
    })
    .catch(function(){ t.className = 'm bot'; t.innerHTML = '⚠️ אין חיבור כרגע. נסו שוב בעוד רגע.'; })
    .then(function(){ busy = false; });
}
var cs = document.querySelectorAll('#types .chip');
for (var i=0;i<cs.length;i++) cs[i].onclick = function(){ var v = this.getAttribute('data-v'); mark(v); send(v, this.textContent); };
var fs = document.querySelectorAll('#forms .chip');
for (var i=0;i<fs.length;i++) fs[i].onclick = function(){ send(this.getAttribute('data-v'), this.textContent); };
document.getElementById('send').onclick = function(){ send(inp.value); };
inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); send(inp.value); } });
// ===== Category entry (same link): agents chat / warehouse & logistics / collection / management =====
// Codes for warehouse & management are checked in n8n workflow "דבטק – אפליקציה: כניסה לפי קטגוריה" (webhook devtec-app-login)
var LOGIN = 'https://yanivsofir.app.n8n.cloud/webhook/devtec-app-login';
var RETURNS_FORM = 'https://yanivsofir.app.n8n.cloud/form/devtech-returns-form';
var DRAFTS = 'https://yanivsofir.app.n8n.cloud/webhook/devtec-app-drafts';
var RETURNS_APP = 'https://yanivsofir.app.n8n.cloud/form/devtech-returns-app'; // opens with the login ticket – no second code
var COLLECT = 'https://yanivsofir.app.n8n.cloud/webhook/devtec-collect';
var $ = function(id){ return document.getElementById(id); };
var footer = document.querySelector('footer');
var greeted = false;
function catSaved(){ var c = get('dv_cat') || getCookie('dv_cat'); var exp = Number(get('dv_cat_exp') || getCookie('dv_cat_exp') || 0); return (c && exp > Date.now()) ? c : ''; }
function saveCat(c, name, ticket){ if (ticket) set('dv_ticket', ticket); var exp = String(Date.now() + DAYS*86400000); set('dv_cat', c); set('dv_cat_exp', exp); set('dv_name', name || ''); setCookie('dv_cat', c, DAYS); setCookie('dv_cat_exp', exp, DAYS); }
function clearCat(){ set('dv_ticket', ''); set('dv_cat', ''); set('dv_cat_exp', '0'); setCookie('dv_cat', '', 0); setCookie('dv_cat_exp', '', 0); }
function head(t, s){ $('ttl').textContent = t; $('sub').textContent = s; }
function screen(which){
  ['cats','login','panel'].forEach(function(id){ $(id).style.display = (id === which) ? 'block' : 'none'; });
  var chat = which === 'chat';
  msgs.style.display = chat ? 'flex' : 'none';
  footer.style.display = chat ? 'flex' : 'none';
  if (chat) showBar(); else bar.style.display = 'none';
  $('switch').style.display = (which === 'cats') ? 'none' : 'block';
}
function openChat(){
  head('דבטק – קבצים לסוכנים', 'מפרטים, גיליונות בטיחות, קטלוגים וסרטונים');
  screen('chat');
  if (!greeted) {
    greeted = true;
    add('bot', md('שלום! 👋 כאן מקבלים כל חומר על מוצרי דבטק:\n📄 מפרטים · ⚠️ בטיחות · 📘 ברושורים · 📚 קטלוגים · 🎬 סרטונים · 🖼️ תמונות מפרויקטים · 🧪 דוחות בדיקה\n📝 וגם טפסים: טופס פתיחת לקוח ופרטי בנק\nכותבים שם מוצר או צורך, ובכפתורים למטה בוחרים סוג קובץ.') + (authed ? '' : '<span class="lock">🔒 כדי להתחיל – הקלידו קוד גישה</span>'));
  }
}
function openCats(){ head('דבטק – אפליקציה', 'בחרו איך להיכנס'); screen('cats'); }
var pendingCat = '';
function openLogin(c){
  pendingCat = c; $('codeIn').value = ''; $('loginErr').textContent = '';
  $('loginTtl').textContent = c === 'manage' ? '⭐ כניסת ניהול' : '📦 כניסת מחסן ולוגיסטיקה';
  head('דבטק – אפליקציה', c === 'manage' ? 'ניהול' : 'מחסן ולוגיסטיקה'); screen('login');
  setTimeout(function(){ try { $('codeIn').focus(); } catch(e){} }, 50);
}
function btnLink(href, title, sub, go){ return '<a class="big' + (go ? ' go' : '') + '" href="' + href + '">' + title + '<small>' + sub + '</small></a>'; }
function openPanel(c){
  var name = get('dv_name') || '';
  var h = '<h2>שלום' + (name && name !== 'ניהול' ? ' ' + esc(name) : '') + ' 👋</h2>';
  var tk = get('dv_ticket') || '';
  h += '<div id="drafts"></div>';
  h += btnLink(tk ? RETURNS_APP + '?ticket=' + encodeURIComponent(tk) : RETURNS_FORM, '📦 טופס החזרת סחורה', tk ? 'בחירת חברה ופרטי ההחזרה – בלי קוד נוסף' : 'בחירת חברה, קוד אישי ופרטי ההחזרה', true);
  if (c === 'manage') {
    h += btnLink(COLLECT, '💰 דיווחי גבייה', 'דיווח על קשיי תשלום של לקוח', false);
    h += '<button class="big" id="toChat">🧑‍💼 קבצים לסוכנים<small>מפרטים, תמונות, סרטונים וטפסים</small></button>';
  }
  h += '<p class="note">הכניסה נשמרת במכשיר ל-5 ימים</p>';
  $('panel').innerHTML = h;
  var tc = $('toChat'); if (tc) tc.onclick = openChat;
  head('דבטק – אפליקציה', c === 'manage' ? '⭐ ניהול' : '📦 מחסן ולוגיסטיקה'); screen('panel');
  if (tk) loadDrafts(tk);
}
function fmtTime(v){
  var d = new Date(v);
  if (!v || isNaN(d.getTime()) || !/\d{4}-\d{2}-\d{2}|^\d{10,}$/.test(String(v))) return String(v || '');
  try { return d.toLocaleString('he-IL', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }); } catch(e){ return String(v); }
}
function loadDrafts(tk){
  fetch(DRAFTS + '?ticket=' + encodeURIComponent(tk))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (Array.isArray(j)) j = j[0] || {};
      var box = $('drafts'); if (!box || get('dv_ticket') !== tk) return;
      var list = (j && j.ok !== false && Array.isArray(j.drafts)) ? j.drafts : [];
      var n = Number(j && j.count) || 0;
      if (n <= 0 || !list.length) { box.innerHTML = ''; return; }
      var h = '<div class="drafts"><h3>⚠️ יש לך ' + n + ' טפסי החזרה שלא נשלחו</h3>';
      for (var i=0;i<list.length;i++) {
        var d = list[i] || {};
        var info = [d.company, fmtTime(d.started)].filter(function(x){ return x; }).map(esc).join(' · ');
        h += '<div class="draft"><b>' + esc(d.customer || 'לקוח') + '</b>' + (info ? '<span>' + info + '</span>' : '');
        if (d.url && /^https?:\/\//i.test(d.url)) h += '<a href="' + esc(d.url) + '">להמשך הטופס</a>';
        h += '</div>';
      }
      box.innerHTML = h + '</div>';
    })
    .catch(function(){});
}
var cbs = document.querySelectorAll('#cats .big');
for (var i=0;i<cbs.length;i++) cbs[i].onclick = function(){
  var c = this.getAttribute('data-c');
  if (c === 'agents') { clearCat(); openChat(); }
  else if (c === 'collect') { location.href = COLLECT; }
  else if (catSaved() === c) openPanel(c);
  else openLogin(c);
};
$('loginBack').onclick = openCats;
$('switch').onclick = function(){ clearCat(); openCats(); };
var loginBusy = false;
function doLogin(){
  var code = $('codeIn').value.replace(/\s/g, '');
  if (!code || loginBusy) return;
  loginBusy = true; $('loginErr').textContent = 'בודק…';
  fetch(LOGIN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ category: pendingCat, code: code, sid: sid }) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (Array.isArray(j)) j = j[0] || {};
      if (j.ok) { saveCat(pendingCat, j.name, j.ticket); openPanel(pendingCat); }
      else { $('loginErr').textContent = j.msg || '❌ קוד שגוי, נסו שוב.'; $('codeIn').value = ''; }
    })
    .catch(function(){ $('loginErr').textContent = '⚠️ אין חיבור כרגע. נסו שוב בעוד רגע.'; })
    .then(function(){ loginBusy = false; });
}
$('loginGo').onclick = doLogin;
$('codeIn').addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); doLogin(); } });
// start: saved warehouse/management entry → its screen; agents who already entered → chat as before; otherwise → choose category
var start = catSaved();
if (start === 'warehouse' || start === 'manage') openPanel(start);
else if (authed) openChat();
else openCats();
})();
</script>
